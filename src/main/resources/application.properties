spring.application.name=cart

# 1. Server Configuration
server.port=8080

# 2. H2 Database Connectivity
spring.datasource.url=jdbc:h2:mem:telesko
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 3. H2 Console Activation
spring.h2.console.enabled=true

# 4. JPA & Hibernate Management
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 5. CRITICAL: Prevent the database from crashing on startup
# Forces Spring to wait for Hibernate to build tables before running data.sql
spring.jpa.defer-datasource-initialization=true

spring.security.user.name=admin
spring.security.user.password=mySecretPassword123

# JWT settings
# jwt.secret should be a Base64-encoded HMAC key with at least 256 bits for production.
jwt.expiration-ms=1800000
